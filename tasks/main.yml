---
- name: Get my public IP
  ipify_facts:

- name: install packages
  with_items: "{{ jabber_packages }}"
  package:
    name: "{{ item.name }}"
  notify:
    - restart jabber

- name: ensure certificate file exists
  file:
    name: /usr/local/etc/ejabberd/certs.pem
    mode: 0600
    owner: ejabberd
    group: ejabberd
    state: touch

- name: install cert updater
  copy:
    src: update_certs.sh
    dest: /usr/local/bin/update_certs.sh
    mode: 0755

- name: convert cert from letsencrypt
  command: /usr/local/bin/update_certs.sh

- name: create upload dir
  file:
    name: /var/cache/ejabberd
    mode: 0700
    owner: ejabberd
    group: ejabberd
    state: directory

- name: configure jabber
  template:
    src: ejabberd.yml.j2
    dest: /usr/local/etc/ejabberd/ejabberd.yml
    owner: ejabberd
    group: ejabberd
  notify:
    - restart jabber

- name: configure ejabberdctl
  template:
    src: ejabberdctl.cfg.j2
    dest: /usr/local/etc/ejabberd/ejabberdctl.cfg
    owner: ejabberd
    group: ejabberd
  notify:
    - restart jabber

- name: enable jabber service
  template:
    src: ejabberd.j2
    dest: /etc/rc.conf.d/ejabberd
  notify:
    - restart jabber
